// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: 'versions.gradle'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$versions.androidGradlePlugin"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$versions.kotlin"
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            // r2-streamer pins a NanoHttpd JitPack snapshot that is no longer served: use the vendored source.
            substitute module('com.github.NanoHttpd.nanohttpd:nanohttpd') using project(':nanohttpd')
            substitute module('com.github.NanoHttpd.nanohttpd:nanohttpd-nanolets') using project(':nanohttpd')
        }
        // r2-shared declares Fuel (jcenter-only); only its unused FuelPromiseExtension references it.
        exclude group: 'com.github.kittinunf.fuel'
    }
    repositories {
        google()
        mavenCentral()
        // R2 streamer/shared (codetoart forks) and NanoHttpd snapshots are only published on JitPack.
        maven {
            url "https://jitpack.io"
            content {
                includeGroupByRegex "com\\.github\\..*"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
