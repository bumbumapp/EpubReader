apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.folioreader.android.sample'
    compileSdk versions.androidCompileSdk

    defaultConfig {
        applicationId "com.bumbumapps.epubreaderpro"
        minSdk versions.androidMinSdk
        targetSdk versions.androidTargetSdk
        versionCode versions.projectVersionCode
        versionName versions.projectVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        debug {
            // Google test ads in debug builds.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~1039447404"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/9568937442"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/5438120748"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE',
                         'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt',
                         'META-INF/dependencies.txt', 'META-INF/LGPL2.1',
                         'META-INF/services/javax.annotation.processing.Processor']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$versions.appcompat"
    implementation "androidx.constraintlayout:constraintlayout:$versions.constraintLayout"
    implementation "com.google.android.material:material:$versions.material"
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation project(':folioreader')
    implementation "com.google.code.gson:gson:$versions.gson"
    implementation "com.fasterxml.jackson.core:jackson-core:$versions.jackson"
    implementation "com.fasterxml.jackson.core:jackson-annotations:$versions.jackson"
    implementation "com.fasterxml.jackson.core:jackson-databind:$versions.jackson"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:$versions.jackson"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.airbnb.android:lottie:6.6.7'
    implementation 'androidx.work:work-runtime:2.10.5'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
